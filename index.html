<meta charset="utf-8">
<title>Kain Na!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Bungee&display=swap">
<style>
/* Layout: one-screen portrait game. HUD → scenery window → dining area with tables → tray → cook stations. Cooking games slide up as a bottom sheet. */
:root{
  --blue:#1b4f8f; --blue-deep:#0d2a50; --sun:#ffc93c; --chili:#e63946; --leaf:#26b06b; --ube:#7b4fa6; --sea:#1f8fb3;
  --chrome:#e4e9ef; --chrome-2:#a9b4c2; --card:#fff3d6; --ink:#1a1420; --muted:#6b6070; --maroon:#5b1d24; --bamboo:#c8a165;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--blue-deep);color:#fff;font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 14px,transparent 14px 28px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;overflow:hidden}

/* HUD */
.hud{display:flex;flex-direction:column;gap:5px}
.hud-row{display:flex;align-items:center;gap:8px}
.day{font-family:var(--display);font-size:12px;background:var(--sun);color:var(--ink);padding:3px 8px;border-radius:8px;letter-spacing:.03em;white-space:nowrap}
.money{font-family:var(--display);font-size:19px;color:var(--sun);font-variant-numeric:tabular-nums}
.goal{flex:1;text-align:right;font-size:13px;color:#cfe0f5;line-height:1.1;font-variant-numeric:tabular-nums}
.goal b{color:#fff}
.goal b.hit{color:#5fe29a}
.icon-btn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);font-size:16px;flex:none;font-weight:800}
.route{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9fb6d3;font-weight:800}
.track{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sun);border-radius:3px}
.veh{position:absolute;top:50%;left:0;width:38px;transform:translate(-50%,-62%) scaleX(-1)}

/* Scene */
.scene{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:4px solid var(--frame,var(--chrome));background:var(--maroon);transform-origin:50% 100%;transition:transform .3s}
.window{position:relative;flex:0 0 30%;max-height:150px;min-height:72px;overflow:hidden;background:#8fd3ff}
.strip{position:absolute;top:0;left:0;height:100%;display:flex;animation:scroll var(--spd,16s) linear infinite}
.strip svg{height:100%;width:auto;flex:none}
@keyframes scroll{to{transform:translateX(-50%)}}
.window::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,var(--frame,var(--chrome)) 0 7px,transparent 7px) 0 0/33.333% 100%;box-shadow:inset 0 -6px 0 var(--frame,var(--chrome))}
.braking .strip{animation-play-state:paused}
.sign{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:10px;letter-spacing:.03em;
  background:var(--signbg,#fff);color:var(--signfg,var(--chili));padding:2px 9px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:opacity .3s}
.cabin{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:50px repeat(var(--n,3),minmax(0,1fr));gap:4px;padding:6px 6px 8px;align-items:end}
.sway .scene{animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
.scene.tip-l{animation:none;transform:rotate(-5deg)}
.scene.tip-r{animation:none;transform:rotate(5deg)}
.scene.bump{animation:bump .18s 3}
@keyframes bump{50%{transform:translateY(-7px)}}

/* Per-ride interiors */
[data-lvl=jeep]{--frame:#dfe5ec}
[data-lvl=jeep] .cabin{background:radial-gradient(circle at 50% 0,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(45deg,rgba(0,0,0,.14) 0 8px,transparent 8px 16px),#5b1d24}
[data-lvl=kariton]{--frame:#2f6fb3;--signbg:#ffc93c;--signfg:#1a1420}
[data-lvl=kariton] .window::after{background:repeating-linear-gradient(90deg,#2f6fb3 0 22px,#f4f4f4 22px 44px) 0 0/100% 12px no-repeat;box-shadow:none}
[data-lvl=kariton] .cabin{background:linear-gradient(rgba(0,0,0,.22),transparent 30%),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 34px),#9a958c}
[data-lvl=lrt]{--frame:#b9c3cd;--signbg:#1d4f9a;--signfg:#fff}
[data-lvl=lrt] .cabin{background:linear-gradient(90deg,transparent 0 24%,#f2c230 24% calc(24% + 4px),transparent 0 74%,#f2c230 74% calc(74% + 4px),transparent 0),radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 1.5px) 0 0/9px 9px,#6f7c8a}
[data-lvl=bangka]{--frame:#c8a165;--signbg:#1f8fb3;--signfg:#fff}
[data-lvl=bangka] .cabin{background:radial-gradient(circle at 50% 0,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(90deg,#8a5a33 0 38px,#6f4627 38px 41px)}
[data-lvl=bus]{--frame:#3b3f47;--signbg:#c0392b;--signfg:#fff}
[data-lvl=bus] .cabin{background:linear-gradient(90deg,transparent 0 45%,rgba(255,255,255,.08) 45% 55%,transparent 55%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 8px),#40444c}

/* Queue + tables */
.queue{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 1px;border-radius:10px;background:rgba(0,0,0,.28);border:2px dashed rgba(255,255,255,.3);overflow:hidden}
.queue .lbl{font-family:var(--display);font-size:9px;letter-spacing:.03em;color:var(--sun)}
.queue .door{margin-top:auto;color:#f0e2e4;font-size:8px}
.queue .q{position:relative;width:42px}
.queue .q svg,.lvl .vi svg,.veh svg{width:100%;height:auto}
.queue .q i{position:absolute;left:6px;right:6px;bottom:0;height:3px;background:var(--leaf);border-radius:2px;transform-origin:left}
.queue .qe{opacity:.45;font-weight:800;font-size:12px}
.tbl{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bub{min-height:36px;display:flex;align-items:center;gap:1px;background:#fff;border-radius:12px;padding:1px 5px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.none{visibility:hidden}
.bub svg{width:32px;height:32px}
.bub .done{opacity:.25;filter:grayscale(1)}
.tbl .art{width:100%}
.tbl .art svg{width:100%;height:auto}
.tbl .pat{width:78%;height:7px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;visibility:hidden}
.tbl .pat.on{visibility:visible}
.tbl .pat i{display:block;height:100%;width:100%;background:var(--leaf)}
.tbl .tip{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:11px;font-weight:800;line-height:1.1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none}
.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Tray */
.tray{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:14px;background:linear-gradient(180deg,var(--chrome),var(--chrome-2));color:var(--ink);flex:none}
.tray .lbl{font-family:var(--display);font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);color:#4b5563;letter-spacing:.1em}
.slots{flex:1;display:flex;gap:6px;justify-content:space-around}
.slot{position:relative;flex:1;max-width:72px;height:54px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.45);box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.slot svg{width:48px;height:48px}
.slot.empty{background:rgba(255,255,255,.25)}
.slot .st{position:absolute;bottom:1px;font-size:10px;color:#c77d00;letter-spacing:-1px;line-height:1;text-shadow:0 1px 0 #fff}
.slot.arm{box-shadow:0 0 0 3px var(--chili)}
.slot.arm::before{content:"Itapon?";position:absolute;top:-9px;font-size:10px;font-weight:800;background:var(--chili);color:#fff;border-radius:6px;padding:0 5px;line-height:1.5;z-index:1}

/* Stations */
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none;padding-bottom:4px}
.stn{display:flex;flex-direction:column;align-items:center;padding:4px 4px 5px;border-radius:16px;background:var(--c);color:var(--t,var(--ink));box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s,filter .2s}
.stn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.stn svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.stn .n{font-family:var(--display);font-size:11px;white-space:nowrap;line-height:1.2}
.stn .p{font-size:12px;font-weight:800;opacity:.85;line-height:1}
.stn.off{filter:grayscale(.8) brightness(.65)}

/* Cooking sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;height:clamp(300px,50%,400px);display:flex;flex-direction:column;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:var(--blue);border-top:5px solid var(--sun);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);animation:up .2s ease-out}
.sheet.tall{height:clamp(380px,64%,540px)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet-head{display:flex;align-items:flex-start;gap:8px}
.sheet-head > div{flex:1;min-width:0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--sun);line-height:1.1}
.sheet p{margin:2px 0 0;font-size:13px;color:#d6e4f7;line-height:1.2}
.x{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);font-size:16px;flex:none}
.mg{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;flex:1 1 0;min-height:110px;display:flex;justify-content:center;align-items:center;touch-action:none}
.stage svg{height:100%;max-width:100%;width:auto;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ctrl{flex:none;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:19px;padding:12px;border-radius:16px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #b8860b;letter-spacing:.04em;width:100%;touch-action:none}
.big:active,.big.held{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
.meter{position:relative;height:28px;border-radius:14px;background:#3a2a2a;overflow:hidden;border:3px solid #fff;flex:none}
.meter .zone{position:absolute;top:0;bottom:0}
.zone.y{background:#f4b942}.zone.g{background:var(--leaf)}
.zone.mark{border:3px solid #5fe29a;background:rgba(38,176,107,.3);z-index:2}
.needle{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 0 2px var(--ink);border-radius:3px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f7e3a1,#d98a2b 60%,#5a2508)}
.meter.pour .fill{background:linear-gradient(90deg,#9fd3ff,#3a8fd6)}
.steps{text-align:center;font-weight:800;font-size:15px}
.ticket{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tk{position:relative;width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.tk svg{width:34px;height:34px}
.tk b{position:absolute;top:-6px;left:-4px;font-size:10px;background:#fff;color:var(--ink);border-radius:8px;padding:0 5px;line-height:1.5}
.tk.now{background:var(--sun);box-shadow:0 0 0 3px #fff}
.tk.ok{opacity:.35}
.ings{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:6px}
.ing{background:#fff;color:var(--ink);border-radius:12px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.ing svg{width:36px;height:36px}
.ing small{font-size:10.5px;font-weight:800;line-height:1.05;text-align:center}
.ing.wrong{animation:nope .3s;background:#ffd6d6}

/* Hazards */
.brake{position:absolute;inset:0;z-index:40;pointer-events:none}
.shout{position:absolute;top:17%;left:50%;transform:translateX(-50%) rotate(-4deg);font-family:var(--display);font-size:26px;color:#fff;background:var(--chili);padding:4px 16px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.3);animation:pop .25s ease-out}
.shout.blue{background:var(--sea);font-size:21px}
.shout.yel{background:var(--sun);color:var(--ink);font-size:21px}
@keyframes pop{from{transform:translateX(-50%) rotate(-4deg) scale(.4)}}
.kapit{pointer-events:auto;position:absolute;width:124px;height:124px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--ring,var(--sun)) calc(var(--p,1) * 360deg),rgba(255,255,255,.25) 0);animation:pulse .35s infinite alternate;touch-action:none}
.kapit span{width:104px;height:104px;border-radius:50%;background:var(--chili);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);text-align:center;line-height:1.1}
.kapit.side-l,.kapit.side-r{width:108px;height:108px;top:46%}
.kapit.side-l{left:max(4px,env(safe-area-inset-left,0px))}
.kapit.side-r{right:max(4px,env(safe-area-inset-right,0px))}
.kapit.side-l span,.kapit.side-r span{width:90px;height:90px;font-size:15px;background:var(--sea)}
.kapit.small{width:84px;height:84px}
.kapit.small span{width:68px;height:68px;font-size:13px;background:#8a5a33}
.kapit.held{--ring:#5fe29a;animation:none}
.kapit.held span{background:#1f8a4f}
@keyframes pulse{to{transform:scale(1.07)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

.pop{position:absolute;z-index:50;font-family:var(--display);font-size:15px;color:#fff;pointer-events:none;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.45);animation:rise 1.1s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-170%)}}
.toast{position:absolute;left:50%;top:66px;transform:translateX(-50%);z-index:45;background:rgba(0,0,0,.8);padding:5px 14px;border-radius:999px;font-weight:700;font-size:14px;pointer-events:none;white-space:nowrap}

/* Screens */
.modal{position:absolute;inset:0;z-index:60;background:rgba(6,20,40,.86);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.logo{font-family:var(--display);font-size:46px;line-height:.92;color:var(--chili);text-align:center;text-shadow:3px 3px 0 var(--sun);margin-top:2px}
.tag{text-align:center;font-weight:800;color:var(--blue);letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.levels{display:flex;flex-direction:column;gap:7px}
.lvl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.lvl:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.lvl .vi{width:62px;flex:none}
.lt{flex:1;min-width:0;line-height:1.15}
.lt b{display:block;font-family:var(--display);font-weight:400;font-size:14px}
.lt small{font-size:12px;color:var(--muted)}
.ld{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ld span{font-family:var(--display);font-size:10px;background:var(--sun);border-radius:8px;padding:2px 6px;white-space:nowrap}
.chili{display:flex;gap:1px}
.chili svg{width:9px;height:12px}
.ghost{font-weight:800;font-size:15px;padding:10px;border-radius:12px;background:rgba(27,79,143,.12);color:var(--blue)}
.ghost[disabled]{opacity:.35;cursor:default}
.stat-row{display:flex;justify-content:space-between;font-size:15px;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:22px;text-align:center;line-height:1.1}
.card h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:14px;color:var(--blue);display:flex;justify-content:space-between}
.shop{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:#fff}
.item .e{font-size:22px}
.item .t{flex:1;min-width:0;line-height:1.15}
.item .t b{display:block;font-size:14px}
.item .t small{font-size:12px;color:var(--muted)}
.buy{font-family:var(--display);font-size:12px;padding:8px 10px;border-radius:10px;background:var(--leaf);color:#fff;white-space:nowrap}
.buy[disabled]{background:#cfc6b6;cursor:default}
.link{font-size:13px;color:var(--muted);text-decoration:underline;align-self:center;padding:4px}
.card p{margin:0;font-size:14px;text-align:center;color:var(--muted)}
.how-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:280px;justify-content:center}
.how-art{width:130px;height:130px;display:grid;place-items:center}
.how-art svg{width:100%;height:100%}
.how-art.wide{width:100%;height:auto}
.how-n{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.12em}
.how-step h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--chili);text-wrap:balance;line-height:1.1}
.card .how-step p{font-size:15px;color:var(--ink);line-height:1.35;max-width:32ch}
.hz-list{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;font-size:13.5px;line-height:1.2}
.hz-list div{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:4px 8px}
.hz-list svg{width:44px;flex:none}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:#d9cdb5}
.dots i.on{background:var(--chili);width:20px}
.how-nav{display:flex;gap:8px}
.how-nav .ghost{flex:0 0 32%}
.how-nav .big{flex:1}

@media (max-height:660px){
  .window{flex-basis:24%;min-height:56px}.bub{min-height:30px}.bub svg{width:26px;height:26px}
  .stn svg{width:36px;height:36px}.slot{height:46px}.slot svg{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  .strip,.kapit,.sway .scene,.scene.bump{animation:none}.shake{animation:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="cl-red" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#fbf1de"/><g transform="translate(9 9)"><g fill="#d6453d"><circle cx="0" cy="-3.6" r="2.4"/><circle cx="3.4" cy="-1.1" r="2.4"/><circle cx="2.1" cy="3" r="2.4"/><circle cx="-2.1" cy="3" r="2.4"/><circle cx="-3.4" cy="-1.1" r="2.4"/></g><circle r="1.5" fill="#f2c14e"/></g><path d="M0 2 q3 -2 5 1 M13 16 q3 -2 5 1" stroke="#3f8f4f" stroke-width="1.4" fill="none"/></pattern>
    <pattern id="cl-blue" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#f3f7fb"/><g transform="translate(9 9)"><g fill="#3d6fc9"><circle cx="0" cy="-3.6" r="2.4"/><circle cx="3.4" cy="-1.1" r="2.4"/><circle cx="2.1" cy="3" r="2.4"/><circle cx="-2.1" cy="3" r="2.4"/><circle cx="-3.4" cy="-1.1" r="2.4"/></g><circle r="1.5" fill="#f2c14e"/></g><path d="M0 2 q3 -2 5 1 M13 16 q3 -2 5 1" stroke="#3f8f4f" stroke-width="1.4" fill="none"/></pattern>
    <pattern id="cl-check" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff"/><rect width="6" height="12" fill="#d64545" opacity=".5"/><rect width="12" height="6" fill="#d64545" opacity=".5"/></pattern>
    <linearGradient id="cl-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f7"/><stop offset="1" stop-color="#a9b3bd"/></linearGradient>
    <pattern id="cl-bamboo" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#dcbb7d"/><rect width="1.5" height="10" fill="#b48c4c"/><rect y="5" width="10" height="1" fill="#c9a463"/></pattern>

<script>
(() => {
/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const S = (vb, inner) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
let uid = 0; const nid = () => 'k' + (++uid);
const sr = seed => { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pickN = (a, n) => shuffle(a.slice()).slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function lerpC(a, b, t) {
  t = clamp(t, 0, 1);
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const cookC = (v, raw, done, burnt, lo = .62, hi = .82) => v < lo ? lerpC(raw, done, v / lo) : v <= hi ? done : lerpC(done, burnt, (v - hi) / (1.05 - hi));
const grillC = c => c <= 1 ? c : 1 + (c - 1);

/* ================= food art ================= */
const plate = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy + 2.5}" rx="${rx}" ry="${ry}" fill="#cfc8bd"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fdfcf9"/><ellipse cx="${cx}" cy="${cy}" rx="${rx * .7}" ry="${ry * .64}" fill="none" stroke="#ebe4d8" stroke-width="1.4"/>`;
const kalamansi = (x, y, r = 5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#4f8f2f"/><circle cx="${x}" cy="${y}" r="${r * .78}" fill="#f2b33d"/><path d="M${x - r * .7} ${y} h${r * 1.4} M${x} ${y - r * .7} v${r * 1.4}" stroke="#f8d77e" stroke-width=".8"/>`;
const bubbles = () => [[60, 72], [122, 50], [142, 82], [80, 46], [104, 88], [150, 62]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2" fill="#fff6d0" opacity=".85"><animate attributeName="r" values="1;3.4;1" dur="${.5 + i * .13}s" repeatCount="indefinite"/></circle>`).join('');
const BG = {
  grill: () => `<rect width="200" height="120" rx="14" fill="#2b2420"/><ellipse cx="100" cy="94" rx="92" ry="22" fill="#4a160a"/>${[...Array(15)].map((_, i) => `<circle cx="${14 + i * 12.3}" cy="${88 + (i % 3) * 5}" r="${5 + (i % 2) * 2}" fill="${['#ff7a1a', '#e8461a', '#ffb03b'][i % 3]}" opacity=".9"/>`).join('')}<g stroke="#9a9a9a" stroke-width="2.6">${[...Array(7)].map((_, i) => `<line x1="12" y1="${20 + i * 12}" x2="188" y2="${20 + i * 12}"/>`).join('')}</g>`,
  wok: () => `<rect width="200" height="120" rx="14" fill="#33302d"/><ellipse cx="100" cy="64" rx="94" ry="50" fill="#1e1e20"/><ellipse cx="100" cy="62" rx="82" ry="42" fill="#d79a35"/><ellipse cx="86" cy="50" rx="46" ry="16" fill="#f0c25a" opacity=".5"/>${bubbles()}`,
  board: () => `<rect width="200" height="120" rx="14" fill="#b98250"/><path d="M0 30 q100 -8 200 0 M0 72 q100 8 200 0 M0 104 q100 -6 200 0" stroke="#a06e40" stroke-width="2" fill="none"/><rect x="26" y="10" width="148" height="102" rx="12" fill="#e2c08d"/><rect x="26" y="10" width="148" height="102" rx="12" fill="none" stroke="#c9a06a" stroke-width="3"/>`,
  counter: () => `<rect width="200" height="120" rx="14" fill="url(#${LV.cloth})"/><rect width="200" height="120" rx="14" fill="rgba(0,0,0,.06)"/>`,
};

function artBBQ(c) {
  const b = c <= 1 ? lerpC('#e9a3a0', '#8e3a17', c) : lerpC('#8e3a17', '#241511', (c - 1) * 2);
  const h = c <= 1 ? lerpC('#f6cdca', '#c8642c', c) : lerpC('#c8642c', '#3a2418', (c - 1) * 2);
  let s = `<line x1="12" y1="88" x2="90" y2="10" stroke="#d8b27a" stroke-width="4" stroke-linecap="round"/>`;
  for (let i = 0; i < 4; i++) {
    const x = 27 + i * 15, y = 73 - i * 15;
    s += `<g transform="rotate(-45 ${x} ${y})"><rect x="${x - 11}" y="${y - 9}" width="22" height="18" rx="7" fill="${b}"/><rect x="${x - 8}" y="${y - 6}" width="11" height="4" rx="2" fill="${h}"/>${c > .4 ? `<path d="M${x - 6} ${y + 5} l5 -9 M${x + 1} ${y + 6} l5 -9" stroke="#2a120a" stroke-width="1.6" opacity="${Math.min(.75, c * .6)}"/>` : `<path d="M${x - 8} ${y + 3} h14" stroke="#fff" stroke-width="1.2" opacity=".6"/>`}</g>`;
  }
  return s;
}
function roll(x, y, len, w, ang, col, cls = '') {
  return `<g transform="rotate(${ang} ${x} ${y})"><rect ${cls ? `class="${cls}" ` : ''}x="${x - len / 2}" y="${y - w / 2}" width="${len}" height="${w}" rx="${w / 2}" fill="${col}"/><rect x="${x - len / 2 + 4}" y="${y - w / 2 + 1.6}" width="${len - 10}" height="${w * .22}" rx="1.5" fill="#fff" opacity=".3"/><path d="M${x - len / 2 + 7} ${y - w / 2 + 1} v${w - 2} M${x + len / 2 - 7} ${y - w / 2 + 1} v${w - 2}" stroke="rgba(0,0,0,.16)" stroke-width="1"/></g>`;
}
function artFish(c) {
  const b = c <= 1 ? lerpC('#b9c3c8', '#9a6a3a', c) : lerpC('#9a6a3a', '#2a1a12', (c - 1) * 2);
  const be = c <= 1 ? lerpC('#e4e9ec', '#c89a5a', c) : lerpC('#c89a5a', '#3a2618', (c - 1) * 2);
  return `<path d="M10 50 Q30 26 64 36 L86 24 Q82 50 86 76 L64 64 Q30 74 10 50Z" fill="${b}"/><path d="M14 52 Q34 66 62 60 Q40 63 14 52Z" fill="${be}"/><path d="M36 38 Q44 27 55 36Z" fill="${b}" stroke="rgba(0,0,0,.2)"/><path d="M40 63 Q46 72 54 62Z" fill="${b}"/><circle cx="22" cy="46" r="4" fill="#fff"/><circle cx="22" cy="46" r="2" fill="#111"/><path d="M30 41 Q33 50 30 59" stroke="rgba(0,0,0,.25)" stroke-width="1.5" fill="none"/>${c > .4 ? `<g stroke="#2a140a" stroke-width="2.4" opacity="${Math.min(.8, c * .6)}"><line x1="40" y1="40" x2="32" y2="58"/><line x1="52" y1="38" x2="44" y2="60"/><line x1="64" y1="40" x2="56" y2="60"/></g>` : ''}`;
}
function artCorn(c, butter = 0) {
  const k = c <= 1 ? lerpC('#f7d64a', '#e2a02a', c) : lerpC('#e2a02a', '#3a2210', (c - 1) * 2);
  let s = `<line x1="10" y1="90" x2="30" y2="70" stroke="#d8b27a" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-45 55 45)"><path d="M14 45 Q16 28 30 31 L30 59 Q16 62 14 45Z" fill="#8fb15a"/><rect x="28" y="30" width="64" height="30" rx="15" fill="${k}"/>`;
  for (let i = 0; i < 9; i++) for (let j = 0; j < 4; j++) {
    const ch = c > .5 && ((i * 7 + j * 3) % 5 === 0);
    s += `<rect x="${32 + i * 6.4}" y="${33 + j * 6.4}" width="5.2" height="5.2" rx="2" fill="${ch ? '#4a2a10' : k}" stroke="rgba(0,0,0,.14)" stroke-width=".6"/>`;
  }
  if (butter) s += `<rect x="34" y="34" width="52" height="9" rx="4.5" fill="#fff7b0" opacity="${.3 * butter}"/><circle cx="60" cy="50" r="3" fill="#fff3a0" opacity="${.4 * butter}"/>`;
  return s + '</g>';
}

/* halo-halo */
const HALO_SWEETS = ['beans', 'nata', 'sago', 'langka', 'saging', 'kaong'];
const HALO_ALL = [...HALO_SWEETS, 'yelo', 'gatas', 'ube', 'flan', 'pinipig'];
const SW = {
  beans:  { bg: '#6e2a20', n: 14, f: (x, y) => `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="1.8" fill="#9c3f30"/>` },
  nata:   { bg: '#efeadb', n: 12, f: (x, y) => `<rect x="${x - 2.3}" y="${y - 2.3}" width="4.6" height="4.6" rx=".8" fill="#fbf9f2" stroke="#d6cdb4" stroke-width=".6"/>` },
  sago:   { bg: '#cdb48a', n: 16, f: (x, y) => `<circle cx="${x}" cy="${y}" r="1.9" fill="#3b271b"/>` },
  langka: { bg: '#f0c548', n: 12, f: (x, y) => `<path d="M${x - 3} ${y + 1} q3 -4 6 0" stroke="#d99a1e" stroke-width="1.6" fill="none"/>` },
  saging: { bg: '#a8561f', n: 9,  f: (x, y) => `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.2" fill="#ecc77e" stroke="#8a4a1a" stroke-width=".6"/>` },
  kaong:  { bg: '#ece4f0', n: 11, f: (x, y) => `<ellipse cx="${x}" cy="${y}" rx="2.8" ry="1.9" fill="#d6c3e6" stroke="#b39bc9" stroke-width=".6"/>` },
};
function haloSVG(L) {
  const id = nid(), cx = 50, top = 24, bot = 94, wt = 50, wb = 36;
  const x1t = cx - wt / 2, x2t = cx + wt / 2, x1b = cx - wb / 2, x2b = cx + wb / 2;
  const trap = `M${x1t} ${top} L${x2t} ${top} L${x2b} ${bot} Q${cx} ${bot + 4} ${x1b} ${bot} Z`;
  const r = sr(7);
  let y = bot + 3, inner = '', above = '', iceBot = null;
  const mound = `M${x1t - 1} ${top + 1} Q${x1t + 1} ${top - 10} ${cx - 10} ${top - 12} Q${cx} ${top - 21} ${cx + 10} ${top - 12} Q${x2t - 1} ${top - 10} ${x2t + 1} ${top + 1} Z`;
  for (const ing of L) {
    if (SW[ing]) {
      const h = 10.5, y0 = y - h, d = SW[ing];
      inner += `<rect x="0" y="${y0}" width="100" height="${h + .6}" fill="${d.bg}"/>`;
      for (let i = 0; i < d.n; i++) inner += d.f(22 + r() * 56, y0 + 1.8 + r() * (h - 3.6));
      y = y0;
    } else if (ing === 'yelo') {
      iceBot = y;
      inner += `<rect x="0" y="${top}" width="100" height="${y - top + .5}" fill="#eef6fb"/>`;
      for (let i = 0; i < 16; i++) inner += `<circle cx="${22 + r() * 56}" cy="${top + 2 + r() * (y - top - 4)}" r="1.1" fill="#cfe3ef"/>`;
      above += `<path d="${mound}" fill="#f4f9fc"/>`;
      for (let i = 0; i < 9; i++) above += `<circle cx="${x1t + 5 + r() * (wt - 10)}" cy="${top - 2 - r() * 9}" r="${1.4 + r() * 1.4}" fill="#ffffff"/>`;
      above += `<line x1="${cx + 13}" y1="${top - 6}" x2="${cx + 28}" y2="${top - 22}" stroke="#c9ced4" stroke-width="3" stroke-linecap="round"/>`;
      y = top;
    } else if (ing === 'gatas') {
      if (iceBot) inner += `<rect x="0" y="${top}" width="100" height="${iceBot - top}" fill="#f2dfb6" opacity=".55"/><path d="M${x1t + 8} ${top} q2 10 0 16 M${cx + 6} ${top} q-2 14 0 22" stroke="#f6e7c6" stroke-width="3" fill="none"/>`;
      above += `<path d="${mound}" fill="#f3e2bd" opacity=".6"/>`;
    } else if (ing === 'flan') {
      above += `<rect x="${cx - 19}" y="${top - 20}" width="19" height="10" rx="2" fill="#f6c443"/><rect x="${cx - 19}" y="${top - 20}" width="19" height="3.6" rx="1.5" fill="#9c4f16"/>`;
    } else if (ing === 'ube') {
      above += `<circle cx="${cx + 8}" cy="${top - 15}" r="8" fill="#6a3d9a"/><circle cx="${cx + 5}" cy="${top - 18}" r="2.5" fill="#9b70c8"/>`;
    } else if (ing === 'pinipig') {
      for (let i = 0; i < 14; i++) above += `<ellipse cx="${x1t + 5 + r() * (wt - 10)}" cy="${top - 4 - r() * 12}" rx="1.4" ry=".9" fill="#c99a5b"/>`;
    }
  }
  return `<defs><clipPath id="${id}"><path d="${trap}"/></clipPath></defs><ellipse cx="${cx}" cy="${bot + 4}" rx="${wb / 2 + 7}" ry="4" fill="rgba(0,0,0,.18)"/><path d="${trap}" fill="rgba(255,255,255,.3)"/><g clip-path="url(#${id})">${inner}</g><path d="${trap}" fill="none" stroke="#fff" stroke-width="2"/>${above}<path d="M${x1t + 4} ${top + 6} L${x1b + 3} ${bot - 6}" stroke="#fff" stroke-width="3" opacity=".45" stroke-linecap="round"/>`;
}

/* drinks and bowls */
function artSago(add, fill) {
  const id = nid(), tr = 'M26 8 L74 8 L68 94 Q50 97 32 94 Z', H = 86, r = sr(3);
  let it = '';
  for (let i = 0; i < add * 3; i++) it += `<rect x="${33 + r() * 28}" y="${70 + r() * 18 - i * 3}" width="7" height="7" rx="1" fill="${i % 2 ? '#3aa86b' : '#d64161'}" opacity=".82"/>`;
  for (let i = 0; i < add * 6; i++) it += `<circle cx="${34 + r() * 32}" cy="${82 + r() * 10}" r="2.3" fill="#2e1d14"/>`;
  return `<defs><clipPath id="${id}"><path d="${tr}"/></clipPath></defs><path d="${tr}" fill="rgba(255,255,255,.4)"/><g clip-path="url(#${id})"><rect class="fl" data-b="94" data-h="${H}" x="0" y="${94 - fill * H}" width="100" height="${fill * H}" fill="#7a3f12" opacity=".78"/>${it}</g><path d="M60 0 L53 72" stroke="#e63946" stroke-width="4.5" stroke-linecap="round"/><path d="M60 0 L53 72" stroke="#fff" stroke-width="4.5" stroke-dasharray="4 5"/><path d="${tr}" fill="none" stroke="#fff" stroke-width="1.8"/><rect x="24" y="6" width="52" height="4" rx="2" fill="#fff" opacity=".85"/>`;
}
function artTaho(sc, sy, sg, ladle) {
  const id = nid(), tr = 'M22 30 L78 30 L71 94 Q50 97 29 94 Z', tt = 94 - sc / 3 * 40, h = sy * 20;
  let s = `<defs><clipPath id="${id}"><path d="${tr}"/></clipPath></defs><path d="${tr}" fill="rgba(255,255,255,.45)"/><g clip-path="url(#${id})"><rect x="0" y="${tt}" width="100" height="${100 - tt}" fill="#f7f3e8"/>${sc ? `<path d="M20 ${tt + 9} q15 -4 30 0 t30 0 M24 ${tt + 20} q14 -4 28 0 t28 0" stroke="#e6dfcd" stroke-width="1.4" fill="none"/>` : ''}<rect class="syr" data-t="${tt}" x="0" y="${tt - h}" width="100" height="${h + 3}" fill="#8a4512" opacity=".88"/><path d="M34 ${tt} q2 10 0 16 M60 ${tt} q-2 12 0 20" stroke="#8a4512" stroke-width="3" opacity="${sy > .05 ? .7 : 0}" fill="none" class="syr2"/></g>`;
  const top = tt - h;
  for (let i = 0; i < sg * 7; i++) s += `<circle cx="${32 + ((i * 37) % 36)}" cy="${top - 1 + (i % 3) * 2}" r="2.6" fill="#c79a5e"/><circle cx="${31 + ((i * 37) % 36)}" cy="${top - 2 + (i % 3) * 2}" r=".9" fill="#fff" opacity=".7"/>`;
  s += `<path d="${tr}" fill="none" stroke="#fff" stroke-width="1.8"/><rect x="20" y="28" width="60" height="4" rx="2" fill="#fff" opacity=".85"/>`;
  if (ladle) s += `<g transform="rotate(-24 22 20)"><ellipse cx="22" cy="22" rx="15" ry="6.5" fill="#c3cad3"/><ellipse cx="22" cy="21" rx="12" ry="4.2" fill="#f7f3e8"/><rect x="35" y="19" width="44" height="4" rx="2" fill="#aeb6c0"/></g>`;
  return s;
}
function bun(cx, cy, r, dot = true) {
  return `<ellipse cx="${cx}" cy="${cy + r * .55}" rx="${r * 1.05}" ry="${r * .28}" fill="rgba(0,0,0,.14)"/><path d="M${cx - r} ${cy + r * .45} Q${cx - r} ${cy - r * .9} ${cx} ${cy - r * .95} Q${cx + r} ${cy - r * .9} ${cx + r} ${cy + r * .45} Q${cx} ${cy + r * .7} ${cx - r} ${cy + r * .45}Z" fill="#fbf8f1"/><path d="M${cx - r * .7} ${cy - r * .2} Q${cx - r * .6} ${cy - r * .7} ${cx - r * .2} ${cy - r * .8}" stroke="#fff" stroke-width="2" fill="none" opacity=".9"/><path d="M${cx} ${cy - r * .95} q-${r * .35} ${r * .25} -${r * .6} ${r * .55} M${cx} ${cy - r * .95} q${r * .35} ${r * .25} ${r * .6} ${r * .55} M${cx} ${cy - r * .95} v${r * .5}" stroke="#e3dccb" stroke-width="1.4" fill="none"/>${dot ? `<circle cx="${cx}" cy="${cy - r * .72}" r="${r * .12}" fill="#d62f2f"/>` : ''}`;
}
function artCoco(crack, open) {
  let s = `<ellipse cx="50" cy="62" rx="34" ry="31" fill="#5f9e3a"/><ellipse cx="42" cy="54" rx="13" ry="18" fill="#7cbb52" opacity=".55"/><path d="M24 76 Q50 92 76 76" stroke="#4a7f2c" stroke-width="2" fill="none"/>`;
  if (open) s += `<path d="M22 40 Q50 30 78 40 L76 46 Q50 36 24 46Z" fill="#e8f0d8"/><ellipse cx="50" cy="40" rx="27" ry="8" fill="#f6f8ee"/><ellipse cx="50" cy="40" rx="19" ry="5" fill="#dde9ef"/>`;
  else {
    s += `<path d="M28 36 Q50 18 72 36 Q50 28 28 36Z" fill="#9ccc6a"/>`;
    const cr = ['M40 32 l6 8 l-3 7', 'M61 31 l-4 9 l5 5', 'M50 26 l1 10 l-4 7'];
    for (let i = 0; i < crack; i++) s += `<path d="${cr[i]}" stroke="#f4f0dc" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  }
  return s;
}
function artKinilaw(L) {
  const h = k => L.includes(k);
  let s = `<ellipse cx="50" cy="88" rx="42" ry="7" fill="rgba(0,0,0,.16)"/><path d="M6 48 Q8 88 50 88 Q92 88 94 48Z" fill="#7a4a28"/><path d="M14 64 Q50 74 86 64 M18 76 Q50 84 82 76" stroke="#5e3820" stroke-width="1.5" fill="none"/><ellipse cx="50" cy="48" rx="44" ry="13" fill="#8a5a33"/>`;
  s += `<ellipse cx="50" cy="49" rx="39" ry="10.5" fill="${h('isda') ? '#efe9dc' : '#4e3018'}"/>`;

    });
    return {
      update(dt) { if (lock) return; pos += dir * speed * dt; if (pos >= 1) { pos = 1; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; } needle.style.left = pos * 100 + '%'; },
      jolt() { if (!lock) { pos = Math.random(); pop(A.stage(), 'Gumalaw!', '#ff8a8a'); } },
    };
  },
  hold(ph, st, A) {
    A.draw(); A.live(0, ph);
    const widen = P.up.uling ? .05 : 0, sway = !!(LV.sway && ph.pour);
    let lo = ph.lo - widen, hi = ph.hi + widen, v = 0, holding = false, t = 0, finished = false;
    const rate = ph.rate / (1 + diff() * .03);
    A.ctrl().innerHTML = `<div class="meter${ph.pour ? ' pour' : ''}"><div class="fill"></div><div class="zone mark" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></div></div><button class="big">${ph.label}</button>`;
    const fill = A.ctrl().querySelector('.fill'), zoneEl = A.ctrl().querySelector('.zone'), b = A.ctrl().querySelector('button');
    const words = ph.words || ['Hilaw!', 'Golden!', 'Sunog!'];
    function release() {
      if (finished || !holding) return;
      holding = false; finished = true; b.classList.remove('held');
      let s, w;
      if (v >= lo && v <= hi) { s = 3; w = words[1]; } else if (v >= lo - .12 && v <= hi + .1) { s = 2; w = 'Ok!'; } else { s = 1; w = v < lo ? words[0] : words[2]; }
      A.done(s, w);
    }
    holdButton(b, () => { if (finished || holding) return; holding = true; b.classList.add('held'); sfx('tap'); }, release);
    return {
      update(dt) {
        t += dt;
        if (sway) { const c = ((ph.lo + ph.hi) / 2) + .12 * Math.sin(t * 2.3), half = (ph.hi - ph.lo) / 2 + widen; lo = c - half; hi = c + half; zoneEl.style.left = lo * 100 + '%'; }
        if (holding) { v += dt / rate; if (v >= 1) { v = 1; release(); } fill.style.width = v * 100 + '%'; A.live(v, ph); }
      },
      jolt() { if (!finished) { v = Math.min(.99, v + .18); fill.style.width = v * 100 + '%'; A.live(v, ph); pop(A.stage(), 'Natapon!', '#ff8a8a'); } },
    };
  },
  ready(ph, st, A) {
    A.draw(); A.live(0, ph);
    const widen = P.up.uling ? .05 : 0, lo = ph.lo - widen, hi = ph.hi + widen, words = ph.words;
    let v = 0, finished = false;
    A.ctrl().innerHTML = `<div class="meter"><div class="fill"></div><div class="zone mark" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></div></div><button class="big">${ph.label}</button>`;
    const fill = A.ctrl().querySelector('.fill'), b = A.ctrl().querySelector('button');
    function judge() {
      if (finished) return; finished = true;
      let s, w;
      if (v >= lo && v <= hi) { s = 3; w = words[1]; } else if (v >= lo - .1 && v <= hi + .08) { s = 2; w = 'Ok!'; } else { s = 1; w = v < lo ? words[0] : words[2]; }
      A.done(s, w);
    }
    onTap(b, judge);
    return {
      update(dt) { if (finished) return; v += dt / ph.rate; fill.style.width = Math.min(1, v) * 100 + '%'; A.live(v, ph); if (v >= 1.02) judge(); },
      jolt() { if (!finished) { v += .15; pop(A.stage(), 'Gumalaw!', '#ff8a8a'); } },
    };
  },
  order(ph, st, A) {
    const recipe = ph.gen();
    const decoys = pickN(ph.pool.filter(x => !recipe.includes(x)), ph.decoys || 2);
    const opts = shuffle([...recipe, ...decoys]);
    st[ph.key] = []; A.draw();
    let step = 0, miss = 0, finished = false;
    A.ctrl().innerHTML = `<div class="ticket">${recipe.map((k, i) => `<span class="tk${i === 0 ? ' now' : ''}"><b>${i + 1}</b>${S('0 0 40 40', ING[k].a())}</span>`).join('')}</div><div class="ings" style="--c:${opts.length > 6 ? 4 : 3}">${opts.map(k => `<button class="ing" data-k="${k}">${S('0 0 40 40', ING[k].a())}<small>${ING[k].n}</small></button>`).join('')}</div>`;
    const tks = A.ctrl().querySelectorAll('.tk');
    A.ctrl().querySelectorAll('.ing').forEach(b => onTap(b, () => {
      if (finished) return;
      if (b.dataset.k === recipe[step]) {
        st[ph.key].push(b.dataset.k); A.draw(); sfx('pop');
        tks[step].classList.remove('now'); tks[step].classList.add('ok'); step++;
        if (step >= recipe.length) { finished = true; A.done(Math.max(1, 3 - miss), miss ? 'Ok!' : 'Perfect!'); }
        else tks[step].classList.add('now');
      } else { miss++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfx('bad'); pop(b, 'Mali!', '#ff8a8a'); }
    }));
    return { jolt() { if (!finished) { miss++; pop(A.stage(), 'Natapon!', '#ff8a8a'); } } };
  },
  catch(ph, st, A) {
    const spots = [[58, 52], [100, 42], [142, 54], [78, 80], [122, 82]];
    const fresh = (x, y, c = 0) => ({ x, y, c, rate: rand(.24, .4) });
    st.balls = spots.map(([x, y]) => fresh(x, y, rand(0, .38))); st.caught = [];
    let good = 0, finished = false;
    A.draw();
    A.ctrl().innerHTML = `<div class="steps">Tusukin ang golden! · <span>0</span>/${ph.n}</div>`;
    const cnt = A.ctrl().querySelector('span');
    const col = c => c < .62 ? lerpC('#efe7d6', '#c98432', c / .62) : c <= .88 ? '#c98432' : lerpC('#c98432', '#3d220e', (c - .88) / .25);
    A.stage().onpointerdown = e => {
      if (finished) return;
      const g = e.target.closest('[data-b]'); if (!g) return;
      const i = +g.dataset.b, b = st.balls[i];
      const ok = b.c >= .62 && b.c <= .88;
      if (ok) good++;
      st.caught.push(col(b.c)); cnt.textContent = st.caught.length;
      pop(g, ok ? 'Golden!' : b.c < .62 ? 'Hilaw!' : 'Sunog!', ok ? '#fff' : '#ff8a8a'); sfx(ok ? 'good' : 'bad');
      st.balls[i] = fresh(b.x, b.y); A.draw();
      if (st.caught.length >= ph.n) { finished = true; A.done(good >= ph.n ? 3 : good >= ph.n - 2 ? 2 : 1, null); }
    };
    return {
      update(dt) {
        if (finished) return;
        const svg = A.svg(); if (!svg) return;
        st.balls.forEach((b, i) => { b.c += b.rate * dt; const el = svg.querySelector(`[data-b="${i}"] .bf`); if (el) el.setAttribute('fill', col(b.c)); });
      },
      jolt() { st.balls.forEach(b => (b.c += .2)); pop(A.stage(), 'Talsik!', '#ff8a8a'); },
    };
  },
};

/* ================= render ================= */
function renderHud() {
  $('#day').textContent = `${LV.n.toUpperCase()} · ARAW ${day()}`;
  $('#money').textContent = `₱${P.money}`;
  const e = D ? D.earned : 0, t = target(day());
  $('#goal').innerHTML = `Kita <b class="${e >= t ? 'hit' : ''}">₱${e}</b> / ₱${t}`;
  $('#mute').textContent = muted ? '🔇' : '🔊';
  if (!D) { rfill.style.width = '0%'; rveh.style.left = '0%'; }
}
function renderSeats() {
  const seats = D ? D.seats : [...Array(LV.tables)].map(() => ({ state: 'empty' }));
  const waiting = D && D.queue.length;
  seats.forEach((s, i) => {
    const el = seatEls[i]; if (!el) return;
    const bub = el.querySelector('.bub'), pat = el.querySelector('.pat'), tip = el.querySelector('.tip');
    el.querySelector('.art').innerHTML = slotSVG(s);
    if (s.state === 'cust') {
      bub.className = 'bub'; bub.innerHTML = s.c.orders.map((o, k) => `<span class="${s.c.served[k] ? 'done' : ''}">${icon(o)}</span>`).join('');
      pat.classList.add('on'); tip.textContent = '';
      el.setAttribute('aria-label', `${s.c.type.n} wants ${s.c.orders.filter((o, k) => !s.c.served[k]).map(o => DISHES[o].n).join(' and ')}`);
    } else {
      bub.className = 'bub none'; bub.innerHTML = ''; pat.classList.remove('on');
      tip.textContent = s.state === 'dirty' ? `Linisin (${3 - (s.scrub || 0)})` : s.state === 'empty' && waiting ? 'Tap to seat' : '';
      el.setAttribute('aria-label', s.state === 'dirty' ? 'Dirty table, tap to clean' : s.state === 'eating' ? `${s.c.type.n} is eating` : 'Empty table');
    }
  });
  if (D && D.running) tick();
}
function renderQueue() {
  const q = D ? D.queue : [];
  queueEl.innerHTML = `<span class="lbl">PILA</span>${q.map(c => `<span class="q">${queueFace(c.type)}<i></i></span>`).join('')}${q.length ? '' : '<span class="qe">…</span>'}<span class="lbl door">${{ jeep: 'ESTRIBO', kariton: 'BANGKETA', lrt: 'PINTO', bangka: 'DAUNGAN', bus: 'PINTO' }[L]}</span>`;
}
function renderTray() {
  const n = traySize(); let h = '';
  for (let j = 0; j < n; j++) {
    const d = D ? D.tray[j] : null;
    h += d ? `<button class="slot${D.armed === j ? ' arm' : ''}" data-j="${j}" aria-label="${DISHES[d.id].n}, ${d.stars} stars">${icon(d.id)}<span class="st">${'★'.repeat(d.stars)}</span></button>` : `<span class="slot empty"></span>`;
  }
  slotsEl.innerHTML = h;
}
function renderStations() {
  const off = !D || !D.running || !!MG || D.tray.length >= traySize();
  stationsEl.querySelectorAll('.stn').forEach(b => { b.classList.toggle('off', off); b.setAttribute('aria-disabled', off); });
}
function renderAll() { renderHud(); renderQueue(); renderSeats(); renderTray(); renderStations(); }

/* ================= screens ================= */
const chiliSVG = S('0 0 9 12', '<path d="M4 3 Q8 4 7 8 Q6 11 3 11 Q5 8 4 3Z" fill="#e63946"/><path d="M4 3 l1 -2.5" stroke="#3f8f4f" stroke-width="1.4"/>');
function showStart() {
  let armReset = false;
  const anyProgress = P.money > 0 || LEVELS.some(l => P.days[l.id] > 1);
  mcard.innerHTML = `<div class="logo">KAIN<br>NA!</div><div class="tag">Kusina on the go</div>
    <div class="levels">${LEVELS.map((l, i) => `<button class="lvl" data-l="${l.id}"><span class="vi">${veh(l.id)}</span><span class="lt"><b>${i + 1}. ${l.n}</b><small>${l.place} · ${l.blurb}</small></span><span class="ld"><span>Araw ${P.days[l.id]}</span><span class="chili">${chiliSVG.repeat(i + 1)}</span></span></button>`).join('')}</div>
    <button class="ghost" id="how">How to play</button>
    ${anyProgress ? '<button class="link" id="reset">Start over</button>' : ''}`;
  modal.hidden = false;
  mcard.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => { applyLevel(b.dataset.l); save(); sfx('good'); startDay(); }));
  $('#how', mcard).addEventListener('click', () => showHow(0, false));
  const rs = $('#reset', mcard);
  if (rs) rs.addEventListener('click', () => {
    if (!armReset) { armReset = true; rs.textContent = 'Tap again to erase progress'; return; }
    P = { money: 0, up: {}, days: {}, seenHow: true, last: L }; LEVELS.forEach(l => (P.days[l.id] = 1)); save(); D = null; renderAll(); showStart();
  });
}
const HOW = [
  { art: () => slotSVG({ state: 'cust', c: { type: TYPES.lola, orders: ['halo'], served: [false] }, mood: 'happy' }), t: 'Paupuin', d: 'Passengers line up at the <b>pila</b> on the left. Tap the line, or an empty table, to seat them.' },
  { art: () => S('0 0 100 100', DISHES.halo.icon()), t: 'Magluto', d: 'Tap a dish at the bottom and play its cooking game: flip the BBQ, roll the lumpia, build the halo-halo layer by layer. More ★ means bigger tips.' },
  { art: () => slotSVG({ state: 'eating', c: { type: TYPES.tita, orders: ['bbq'], served: [true] } }), t: 'Ihain', d: 'Tap a customer to serve what they ordered. Watch the bar under the table. Too slow and they walk out.' },
  { art: () => slotSVG({ state: 'dirty', scrub: 1 }), t: 'Linisin', d: 'They leave a dirty plate (and a langaw). Tap it 3× before the next person sits. Tap a tray dish twice to toss it.' },
  { wide: true, art: () => `<div class="hz-list">${LEVELS.map(l => `<div>${veh(l.id)}<span><b>${HZ_TEXT[l.hazard][0]}</b> ${HZ_TEXT[l.hazard][1]}</span></div>`).join('')}</div>`, t: 'Iba-iba ang gulo', d: 'Every ride has its own chaos. Miss it and food flies off your tray.' },
  { art: () => S('0 0 100 100', `<circle cx="50" cy="52" r="38" fill="#c99a2e"/><circle cx="50" cy="50" r="38" fill="#f2c14e"/><circle cx="50" cy="50" r="30" fill="none" stroke="#d9a62e" stroke-width="3"/><text x="50" y="64" font-size="40" font-weight="900" font-family="Arial" text-anchor="middle" fill="#9c6a10">₱</text>`), t: 'Abutin ang target', d: 'Earn the day’s target before the trip ends to unlock the next day. Buy upgrades between days.' },
];
let resumeAfterHow = false;
function showHow(i, fromGame) {
  if (fromGame !== undefined) resumeAfterHow = fromGame;
  const h = HOW[i], lastStep = i === HOW.length - 1;
  mcard.innerHTML = `<div class="how-step"><div class="how-art${h.wide ? ' wide' : ''}">${h.art()}</div><div class="how-n">HOW TO PLAY · ${i + 1} / ${HOW.length}</div><h2>${h.t}</h2><p>${h.d}</p></div>
    <div class="dots">${HOW.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="how-nav"><button class="ghost" id="back" ${i === 0 ? 'disabled' : ''}>Back</button><button class="big" id="next">${lastStep ? (resumeAfterHow ? 'Balik sa laro' : 'Game na!') : 'Next'}</button></div>
    ${lastStep ? '' : '<button class="link" id="skip">Skip</button>'}`;
  modal.hidden = false;
  const done = () => { P.seenHow = true; save(); if (resumeAfterHow && D) { modal.hidden = true; D.running = true; } else showStart(); };
  $('#next', mcard).addEventListener('click', () => { sfx('tap'); lastStep ? done() : showHow(i + 1); });
  $('#back', mcard).addEventListener('click', () => { if (i > 0) showHow(i - 1); });
  const sk = $('#skip', mcard); if (sk) sk.addEventListener('click', done);
}
function showDayEnd(passed) {
  const t = target(D.day);
  mcard.innerHTML = `<div class="tag">${LV.n} · Araw ${D.day} · tapos na</div>
    <div class="verdict" style="color:${passed ? 'var(--leaf)' : 'var(--chili)'}">${passed ? 'Ang galing!' : 'Kulang pa!'}</div>
    <div class="stat-row"><span>Kinita</span><b>₱${D.earned}</b></div>
    <div class="stat-row"><span>Target</span><b>₱${t}</b></div>
    <div class="stat-row"><span>Napakain · Umalis</span><b>${D.served} · ${D.lost}</b></div>
    ${passed ? '' : '<p>Hit the target to unlock the next day.</p>'}
    <h3><span>Upgrades</span><span>₱${P.money}</span></h3>
    <div class="shop">${UPGRADES.map(u => `<div class="item"><span class="e">${u.e}</span><span class="t"><b>${u.n}</b><small>${u.d}</small></span><button class="buy" data-u="${u.id}" ${P.up[u.id] || P.money < u.cost ? 'disabled' : ''}>${P.up[u.id] ? 'Meron na' : '₱' + u.cost}</button></div>`).join('')}</div>
    <button class="big" id="go">${passed ? `Next · Araw ${P.days[L]}` : 'Ulitin'}</button>
    <button class="link" id="menu">Ibang sasakyan</button>`;
  modal.hidden = false; renderHud();
  mcard.querySelectorAll('.buy').forEach(b => b.addEventListener('click', () => {
    const u = UPGRADES.find(x => x.id === b.dataset.u);
    if (P.up[u.id] || P.money < u.cost) return;
    P.money -= u.cost; P.up[u.id] = true; save(); sfx('coin'); showDayEnd(passed);
  }));
  $('#go', mcard).addEventListener('click', () => { sfx('good'); startDay(); });
  $('#menu', mcard).addEventListener('click', () => { D = null; renderAll(); showStart(); });
}

/* ================= wiring ================= */
onTap(slotsEl, e => { const b = e.target.closest('.slot[data-j]'); if (b) tapTray(+b.dataset.j); });
onTap($('#sclose'), closeSheet);
$('#mute').addEventListener('click', () => { muted = !muted; save(); renderHud(); });
$('#help').addEventListener('click', () => { if (D && D.running) { D.running = false; showHow(0, true); } else if (modal.hidden) showHow(0, false); });

window.claude?.hot?.snapshot?.(() => ({ P }));
function boot(data) {
  load();
  if (data && data.P && data.P.days) P = data.P;
  applyLevel(P.last || 'jeep');
  renderAll();
  P.seenHow ? showStart() : showHow(0, false);
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
